name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller packaging

      - name: Download Poppler
        shell: pwsh
        run: |
          $url = "https://github.com/oschwartz10612/poppler-windows/releases/download/v24.08.0-0/Release-24.08.0-0.zip"
          Invoke-WebRequest -Uri $url -OutFile poppler.zip -UseBasicParsing
          Expand-Archive -Path poppler.zip -DestinationPath poppler_tmp -Force
          New-Item -ItemType Directory -Force -Path bundle\poppler | Out-Null
          $pdftoppm = Get-ChildItem -Path poppler_tmp -Recurse -Filter "pdftoppm.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($pdftoppm) {
            Copy-Item -Path "$($pdftoppm.DirectoryName)\*" -Destination bundle\poppler -Recurse -Force
            Write-Host "Poppler copied successfully"
          } else {
            Write-Host "Warning: pdftoppm.exe not found, continuing without poppler bundle"
          }

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path assets | Out-Null
          New-Item -ItemType Directory -Force -Path voices | Out-Null
          New-Item -ItemType Directory -Force -Path bundle | Out-Null

          pyinstaller --noconfirm --clean --windowed --name "HamdelPDFOCRPro" --onedir `
            --add-data "app;app" `
            --add-data "assets;assets" `
            --add-data "voices;voices" `
            --add-data "bundle;bundle" `
            --hidden-import=pytesseract `
            --hidden-import=pdf2image `
            --hidden-import=pypdf `
            --hidden-import=PIL `
            --hidden-import=packaging `
            run.py

          if (-not (Test-Path "dist\HamdelPDFOCRPro\HamdelPDFOCRPro.exe")) {
            Write-Error "EXE was not created"
            exit 1
          }
          Write-Host "Build succeeded"

      - name: Create portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\HamdelPDFOCRPro\*" -DestinationPath "HamdelPDFOCRPro-Portable-Windows.zip" -Force
          Get-Item "HamdelPDFOCRPro-Portable-Windows.zip" | Format-List Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HamdelPDFOCRPro-Windows
          path: |
            dist/HamdelPDFOCRPro/
            HamdelPDFOCRPro-Portable-Windows.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: HamdelPDFOCRPro-Portable-Windows.zip
          generate_release_notes: true
          body: |
            ## Hamdel PDF OCR Pro
            
            فایل قابل حمل (Portable) آماده است.
            
            ### نحوه استفاده
            1. فایل zip را دانلود کنید
            2. از حالت فشرده خارج کنید
            3. فایل `HamdelPDFOCRPro.exe` را اجرا کنید
            
            کانال پشتیبانی: https://t.me/Akademi_hamdel
