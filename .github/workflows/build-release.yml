name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download Poppler
        shell: pwsh
        run: |
          $url = "https://github.com/oschwartz10612/poppler-windows/releases/download/v24.08.0-0/Release-24.08.0-0.zip"
          Invoke-WebRequest -Uri $url -OutFile poppler.zip
          Expand-Archive -Path poppler.zip -DestinationPath poppler -Force

      - name: Prepare bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bundle\poppler
          New-Item -ItemType Directory -Force -Path bundle\voices
          if (Test-Path "poppler") {
            $popplerBin = Get-ChildItem -Path poppler -Recurse -Filter "pdftoppm.exe" | Select-Object -First 1
            if ($popplerBin) {
              Copy-Item -Path $popplerBin.DirectoryName\* -Destination bundle\poppler -Recurse -Force
            }
          }

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name "HamdelPDFOCRPro" --onedir `
            --add-data "app;app" `
            --add-data "assets;assets" `
            --add-data "voices;voices" `
            --add-data "bundle;bundle" `
            --hidden-import=pytesseract `
            --hidden-import=pdf2image `
            --hidden-import=pypdf `
            run.py

      - name: Create portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\HamdelPDFOCRPro\*" -DestinationPath "HamdelPDFOCRPro-Portable-Windows.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HamdelPDFOCRPro-Windows
          path: |
            dist/HamdelPDFOCRPro/
            HamdelPDFOCRPro-Portable-Windows.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: HamdelPDFOCRPro-Portable-Windows.zip
          generate_release_notes: true
          body: |
            ## Hamdel PDF OCR Pro
            
            نسخه جدید برنامه آماده است.
            
            ### نحوه استفاده
            فایل zip را دانلود و از حالت فشرده خارج کنید، سپس HamdelPDFOCRPro.exe را اجرا کنید.
            
            کانال: https://t.me/Akademi_hamdel
